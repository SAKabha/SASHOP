name: Build SASHOP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: iossxx/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Find dylib
        run: |
          find packages -type f -name "*.deb" -print
          mkdir -p output
          dpkg-deb -x packages/*.deb output
          find output -name "SASHOP.dylib" -exec cp {} output/SASHOP.dylib \;

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SASHOP-build
          path: output/SASHOP.dylib
