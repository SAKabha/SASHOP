name: Build SASHOP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Build SASHOP
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1

      - name: Extract SASHOP.dylib
        run: |
          mkdir -p output
          dpkg-deb -x packages/*.deb output
          find output -name "SASHOP.dylib" -exec cp {} ./SASHOP.dylib \;
          file SASHOP.dylib

      - name: Upload SASHOP.dylib
        uses: actions/upload-artifact@v4
        with:
          name: SASHOP-build
          path: SASHOP.dylib
